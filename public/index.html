<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Lemon Pages · 页面导航</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f9f6; --card: #fff; --ink: #20271f; --muted: #6a7367; --line: #e2e7de; --accent: #3d6338; --soft: #eef3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .wrap { width: min(100% - 48px, 1000px); margin: 0 auto; }
    header { padding: 30px 0; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 650; letter-spacing: -.3px; }
    .mark { display: grid; place-items: center; width: 32px; height: 32px; background: #e4eb9b; color: #35432a; border-radius: 10px; font-size: 18px; font-weight: 750; }
    main { min-height: calc(100svh - 180px); padding: 72px 0 92px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 650; letter-spacing: 1.8px; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 48px); line-height: 1.2; letter-spacing: -1.5px; font-weight: 650; }
    .intro { margin: 18px 0 0; color: var(--muted); font-size: 17px; }
    .section-label { margin: 56px 0 16px; color: var(--muted); font-size: 13px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 20px; }
    .card { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; max-width: 480px; padding: 28px; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 18px; background: var(--card); transition: border-color .18s, transform .18s, box-shadow .18s; }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 28px #20331a0a; }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .tag { padding: 3px 9px; border-radius: 6px; background: var(--soft); color: var(--accent); font-size: 12px; }
    h2 { margin: 0 0 8px; font-size: 23px; line-height: 1.3; letter-spacing: -.5px; font-weight: 620; }
    .description { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .open { display: flex; align-items: center; justify-content: space-between; width: 100%; padding-top: 22px; border-top: 1px solid var(--line); color: var(--accent); font-size: 14px; font-weight: 550; }
    .open svg { width: 18px; height: 18px; }
    footer { padding: 22px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151a15; --card: #1d241d; --ink: #edf1e8; --muted: #a0aa9b; --line: #313c2e; --accent: #b3cc98; --soft: #2b3926; }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 36px); }
      header { padding: 22px 0; }
      main { padding: 50px 0 64px; }
      .section-label { margin-top: 40px; }
      .card { padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><div class="brand"><span class="mark" aria-hidden="true">L</span><span>Lemon Pages</span></div></div>
  </header>
  <main class="wrap">
    <p class="eyebrow">LEMON PAGES</p>
    <h1>页面导航</h1>
    <p class="intro">报告、原型与设计稿。</p>
    <h2 class="section-label" id="pages-heading">所有页面</h2>
    <nav class="grid" aria-labelledby="pages-heading">
      <a class="card" href="/reports/rook-tabs-design/">
        <span class="tag">设计稿</span>
        <div>
          <h2>Rook 工作台</h2>
          <p class="description">看板、任务详情、会话与自动化，四个工作视图的界面设计。</p>
        </div>
        <span class="open">打开页面<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </nav>
  </main>
  <footer><div class="wrap">Lemon Pages</div></footer>
</body>
</html>
