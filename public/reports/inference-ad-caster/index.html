<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inference 模型访问与 AD Caster 接入方案</title>
  <style>
/* ============================================================================
   report-html baseline
   整段内联进报告的 <style>。不要 <link>，不要导入外部样式，不要 web font。
   ========================================================================= */

:root {
  color-scheme: light;

  /* 纸感暖底 + 墨色文字；不要用纯白底配冷灰，长文阅读会发涩 */
  --ground: #FAF8F4;
  --surface: #FFFFFF;
  --ink: #1B1C1A;
  --ink-strong: #0E0F0E;
  --muted: #6B6E6A;
  --faint: #9A9C97;
  --line: #E5E1D8;
  --line-soft: #F0EDE6;

  --accent: #0F6E75;
  --accent-strong: #0A5257;
  --accent-tint: #E2EFEF;

  /* 多序列图：每条序列一个色相。
     不要用同一色相的三档明度——1.8px 的细线上分不出来，等于没区分。 */
  --series-1: #0F6E75;  /* 青 */
  --series-2: #4A5BA8;  /* 靛 */
  --series-3: #4B5563;  /* 中性灰：参考序列走灰；琥珀与 --warn 同族，会被读成告警 */
  --series-4: #8C4A7A;  /* 紫 */

  --ok: #2E7D4E;      --ok-tint: #E6F1E9;
  --warn: #A9700F;    --warn-tint: #F8F0DE;
  --danger: #B03A2E;  --danger-tint: #F9E8E5;

  /* 事件窗高亮带（图内时间范围标记），不是状态色 */
  --band: #FBF0D8;

  --code-bg: #F1EEE7;

  /* 只用系统字体栈。标题走 sans：中文 serif 回退（SimSun/Songti）在多数
     环境里会明显掉档，英文 serif 标题搬到中文报告上不成立。
     serif 只留给大号数字。 */
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;

  --radius: 12px;
  --radius-sm: 8px;
  --border: 1.5px solid var(--line);
  --measure: 880px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #141614;
    --surface: #1C1F1D;
    --ink: #E6E8E4;
    --ink-strong: #F5F7F3;
    --muted: #9BA09A;
    --faint: #767B75;
    --line: #2B302C;
    --line-soft: #232823;
    --accent: #5FC6CC;
    --accent-strong: #8AD9DE;
    --accent-tint: #12312F;
    --ok: #6FCB96;     --ok-tint: #16301F;
    --warn: #E0AC55;   --warn-tint: #33280F;
    --danger: #E88A7D; --danger-tint: #3A1D19;
    --code-bg: #232823;
    --band: #33280F;
    --series-1: #5FC6CC; --series-2: #9AA9E8;
    --series-3: #9BA3AF; --series-4: #D79AC4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #141614;
  --surface: #1C1F1D;
  --ink: #E6E8E4;
  --ink-strong: #F5F7F3;
  --muted: #9BA09A;
  --faint: #767B75;
  --line: #2B302C;
  --line-soft: #232823;
  --accent: #5FC6CC;
  --accent-strong: #8AD9DE;
  --accent-tint: #12312F;
  --ok: #6FCB96;     --ok-tint: #16301F;
  --warn: #E0AC55;   --warn-tint: #33280F;
  --danger: #E88A7D; --danger-tint: #3A1D19;
  --code-bg: #232823;
  --band: #33280F;
  --series-1: #5FC6CC; --series-2: #9AA9E8;
  --series-3: #9BA3AF; --series-4: #D79AC4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 56px 24px 120px;
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/1.75 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
main { max-width: var(--measure); margin: 0 auto; }

a { color: var(--accent-strong); text-underline-offset: 3px; }

code, kbd, samp {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--code-bg);
  border-radius: 4px;
  padding: .12em .38em;
}

/* ---------- header ---------- */
header { margin-bottom: 36px; }
.head-top {
  display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 8px;
}
h1 {
  margin: 0;
  font-size: 30px; font-weight: 650;
  letter-spacing: -.015em; line-height: 1.3;
  color: var(--ink-strong);
}
.subtitle { margin: 0; color: var(--muted); font-size: 14px; }
.subtitle code { font-size: 13px; }

/* 明示读者这不是手写文档；按需改文案或删掉 */
.pill-auto {
  flex: none;
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); background: var(--line-soft);
  border: var(--border); border-radius: 999px;
  padding: 5px 11px; white-space: nowrap;
}

/* ---------- TL;DR ---------- */
/* 结论先说完。不要用「本文档介绍…」开头。 */
.tldr {
  background: var(--surface);
  border: var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 18px 22px 16px;
  margin-bottom: 44px;
}
.tldr-label {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); margin-bottom: 8px;
}
.tldr p { margin: 0; font-size: 15.5px; color: var(--ink-strong); }
.tldr p + p { margin-top: 10px; }

/* ---------- sections ---------- */
section { margin-bottom: 52px; }
h2 {
  margin: 0 0 6px;
  font-size: 21px; font-weight: 650;
  letter-spacing: -.01em; color: var(--ink-strong);
}
hr.rule { border: none; border-top: 1px solid var(--line); margin: 0 0 22px; }
h3 {
  margin: 26px 0 8px;
  font-size: 15px; font-weight: 650; color: var(--ink-strong);
}
p { margin: 0 0 12px; }
.lede { color: var(--muted); font-size: 14px; margin: -2px 0 18px; }

/* ---------- 指标带 ---------- */
.stats {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}
.stat {
  background: var(--surface); border: var(--border);
  border-radius: var(--radius); padding: 18px 20px 16px;
}
.stat.mark-warn   { border-left: 4px solid var(--warn);   padding-left: 17px; }
.stat.mark-danger { border-left: 4px solid var(--danger); padding-left: 17px; }
.stat.mark-ok     { border-left: 4px solid var(--ok);     padding-left: 17px; }
.stat-num {
  font-family: var(--serif); font-size: 38px; font-weight: 500;
  line-height: 1; color: var(--ink-strong); margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.stat-num .unit { font-size: 18px; margin-left: 3px; color: var(--muted); }
.stat-label {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted);
}
.stat-note { font-family: var(--mono); font-size: 11.5px; margin-top: 7px; color: var(--muted); }
.stat-note.up   { color: var(--ok); }
.stat-note.down { color: var(--danger); }

/* ---------- 要点 ---------- */
.points { list-style: none; margin: 0; padding: 0; }
.points li {
  position: relative; padding: 0 0 14px 26px; color: var(--ink);
}
.points li::before {
  content: ""; position: absolute; left: 6px; top: 9px;
  width: 7px; height: 7px; border-radius: 2px; background: var(--accent);
}
.points li strong { color: var(--ink-strong); font-weight: 650; }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--surface); border: var(--border);
  border-radius: var(--radius); overflow: hidden;
}
thead th {
  text-align: left; font-size: 11px; font-weight: 650;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); background: var(--line-soft);
  padding: 11px 16px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td {
  padding: 12px 16px; font-size: 14px;
  border-bottom: 1px solid var(--line-soft); vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--ground); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }

/* ---------- 时间线 ---------- */
.timeline { position: relative; margin: 0 0 0 4px; padding-left: 26px; border-left: 1.5px solid var(--line); }
.tl-entry { position: relative; padding: 0 0 20px; }
.tl-entry:last-child { padding-bottom: 0; }
.tl-entry::before {
  content: ""; position: absolute; left: -32.5px; top: 7px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--line); border: 2px solid var(--ground);
}
.tl-entry.is-impact::before   { background: var(--danger); }
.tl-entry.is-mitigated::before{ background: var(--ok); }
.tl-entry.is-decision::before { background: var(--accent); }
.tl-time {
  display: block; font-family: var(--mono); font-size: 12px;
  color: var(--muted); margin-bottom: 3px;
}
.tl-body { font-size: 14.5px; }

/* ---------- 风险点 ---------- */
.risk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.risk::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.risk.low::before    { background: var(--ok); }
.risk.medium::before { background: var(--warn); }
.risk.high::before   { background: var(--danger); }

/* ---------- 状态标签 ---------- */
.tag {
  display: inline-block; font-size: 11.5px; font-weight: 600;
  padding: 2px 9px; border-radius: 999px; white-space: nowrap;
}
.tag.ok      { color: var(--ok);     background: var(--ok-tint); }
.tag.warn    { color: var(--warn);   background: var(--warn-tint); }
.tag.danger  { color: var(--danger); background: var(--danger-tint); }
.tag.neutral { color: var(--muted);  background: var(--line-soft); }
.tag.accent  { color: var(--accent-strong); background: var(--accent-tint); }

/* ---------- 提示块 ---------- */
.callout {
  border-radius: var(--radius); padding: 16px 20px;
  background: var(--line-soft); font-size: 14.5px;
}
.callout.warn   { background: var(--warn-tint);   color: var(--ink-strong); }
.callout.danger { background: var(--danger-tint); color: var(--ink-strong); }
.callout.ok     { background: var(--ok-tint);     color: var(--ink-strong); }
.callout p:last-child { margin-bottom: 0; }
.callout-title { font-weight: 650; color: var(--ink-strong); margin-bottom: 5px; }

/* ---------- 图标 ---------- */
/* Lucide 的描边参数收在这里，片段只留 viewBox 和图形；颜色跟随父元素文字色 */
.icon {
  width: 1em; height: 1em; vertical-align: -0.125em; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- 图 ---------- */
figure { margin: 0 0 18px; }
.chart {
  background: var(--surface); border: var(--border);
  border-radius: var(--radius); padding: 20px 22px 14px;
}
.chart svg { display: block; width: 100%; height: auto; }
/* 宽图（viewBox 横向超过 ~800 单位）：窄屏让它横向滚动，别缩到字看不清 */
.chart.wide { overflow-x: auto; }
.chart.wide svg { min-width: 680px; }
figcaption { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
/* caption 要说出结论，不要写「上图为…」 */

/* ---------- 代码块 ---------- */
pre {
  margin: 0 0 16px; padding: 14px 16px;
  background: var(--code-bg); border-radius: var(--radius-sm);
  overflow-x: auto; font-size: 13px; line-height: 1.6;
}
pre code { background: none; padding: 0; font-size: inherit; }

/* ---------- 折叠块 ---------- */
/* 证据附录、查询明细、原始数据、identity 放这里。
   读者只读完一百行，摊在正文里的附录等于没有。 */
.fold {
  background: var(--surface); border: var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 12px;
}
.fold > summary {
  cursor: pointer; font-weight: 650; font-size: 14px;
  color: var(--ink-strong);
}
.fold > summary:hover { color: var(--accent-strong); }
.fold[open] > summary { margin-bottom: 10px; }
.fold .fold-body { font-size: 14px; color: var(--muted); }
.fold .fold-body > :last-child { margin-bottom: 0; }

/* ---------- 锚点 TOC（可选，长报告才用） ---------- */
/* 断点要放得下 main(880) + 两侧留白 + TOC(160)。1180px 时 TOC 会压到正文，
   header 右上角的 pill-auto 首当其冲，所以抬到 1320px。 */
.toc { display: none; }
@media (min-width: 1320px) {
  .toc {
    display: block; position: fixed; top: 72px;
    right: max(24px, calc(50vw - var(--measure) / 2 - 190px));
    width: 160px; font-size: 13px;
  }
  .toc-title {
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); margin-bottom: 10px;
  }
  .toc a {
    display: block; color: var(--muted); text-decoration: none;
    padding: 5px 0 5px 12px; border-left: 1.5px solid var(--line);
    line-height: 1.35;
  }
  .toc a:hover { color: var(--ink-strong); border-left-color: var(--accent); }
}

/* ---------- footer ---------- */
footer {
  margin-top: 60px; padding-top: 18px;
  border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; color: var(--faint);
  line-height: 1.7;
}

@media (max-width: 640px) {
  body { padding: 32px 18px 72px; }
  h1 { font-size: 24px; }
  h2 { font-size: 19px; }
  .stat-num { font-size: 32px; }
  section { margin-bottom: 40px; }
}

/* 报告专用样式 */
.pele {
  --pele-bg: var(--surface, #fff);
  --pele-fg: var(--ink, #1c1c1c);
  --pele-muted: var(--muted, #656565);
  --pele-line: var(--muted, #656565);
  --pele-surface: var(--line-soft, #f1f1f1);
  --pele-border: var(--faint, #808080);
}
.pele .shared rect { fill: var(--shared-fill, #e7f2ff); stroke: var(--shared-line, #6082a6); }
.pele .proposed rect { fill: var(--proposed-fill, #e2f2ef); stroke: var(--proposed-line, #51827b); }
.pele [data-id="edge15"] > path:first-child,
.pele [data-id="edge16"] > path:first-child,
.pele [data-id="edge17"] > path:first-child { stroke-dasharray: 4 3; }
@media (prefers-color-scheme: dark) {
  .pele {
    --pele-bg: var(--surface, #1f1f1f);
    --pele-fg: var(--ink, #f5f5f5);
    --pele-muted: var(--muted, #acacac);
    --pele-line: var(--muted, #acacac);
    --pele-surface: var(--line-soft, #2c2c2c);
    --pele-border: var(--faint, #767b75);
    --shared-fill: #1b3857;
    --shared-line: #7296ba;
    --proposed-fill: #174641;
    --proposed-line: #66a89d;
  }
}

body { padding: 36px 24px 96px; }
main { max-width: 1160px; }
header { margin-bottom: 20px; }
header .subtitle { margin-top: 8px; }
figure { margin: 0; }
.chart-scroll {
  overflow-x: auto;
  border: var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.chart-scroll svg { display: block; width: 100%; margin-inline: auto; }
.key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; border: 1px solid var(--faint); background: var(--line-soft); }
.swatch.shared { background: var(--shared-fill, #e7f2ff); border-color: var(--shared-line, #6082a6); }
.swatch.proposed { background: var(--proposed-fill, #e2f2ef); border-color: var(--proposed-line, #51827b); }
.key a { margin-left: auto; }
.chart-help { display: none; margin: 0 0 8px; color: var(--muted); font-size: 13px; }
figcaption { margin-top: 14px; color: var(--muted); font-size: 14px; }
figcaption p { margin: 0 0 6px; }
footer { margin-top: 16px; }
@media (max-width: 1028px) { .chart-help { display: block; } }
@media (max-width: 600px) {
  body { padding: 22px 14px 96px; }
  h1 { font-size: 24px; }
  .key a { margin-left: 0; }
}

  </style>
</head>
