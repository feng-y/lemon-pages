const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const categories=['设计原型','技术方案','分析报告','使用文档'];
const seedTopics=[
 {id:'rook',title:'Rook 工作台设计',description:'看板、任务详情、会话与自动化，四个工作视图的界面设计。',category:'设计原型',project:'Rook',updated:'2026-11-25T16:20',revisions:[{name:'v2',date:'11 月 25 日 · 16:20',note:'调整页面层级，完善四个视图的交互细节。',url:'https://lemon-pages.lemonsun224.workers.dev/reports/rook-tabs-design-v2/'},{name:'v1',date:'11 月 24 日 · 10:30',note:'工作台初版设计。',url:'https://lemon-pages.lemonsun224.workers.dev/reports/rook-tabs-design/'}]},
 {id:'navigation',title:'页面导航与归档交互',description:'按时间浏览，按内容分类，收纳同一主题的多轮更新。',category:'设计原型',project:'Lemon Pages',updated:'2026-11-25T11:40',revisions:[{name:'v1',date:'11 月 25 日 · 11:40',note:'时间与分类导航初稿。'}]},
 {id:'publish',title:'静态页面发布流程',description:'从本地文件到线上链接的发布流程与站点结构。',category:'技术方案',project:'Lemon Pages',updated:'2026-11-24T18:05',revisions:[{name:'v3',date:'11 月 24 日 · 18:05',note:'补充发布后的核对流程。'},{name:'v2',date:'11 月 21 日 · 14:00',note:'完善站点结构。'},{name:'v1',date:'11 月 18 日 · 09:40',note:'初版方案。'}]},
 {id:'task',title:'任务详情页交互',description:'让任务进展、关联会话和待处理事项集中可见。',category:'设计原型',project:'Rook',updated:'2026-11-24T10:00',revisions:[{name:'v2',date:'11 月 24 日 · 10:00',note:'补充任务状态和会话入口。'},{name:'v1',date:'11 月 19 日 · 11:00',note:'初版布局。'}]},
 {id:'analysis',title:'页面访问月度分析',description:'阅读来源、热门页面与内容访问趋势。',category:'分析报告',project:'Lemon Pages',updated:'2026-11-22T17:30',revisions:[{name:'v1',date:'11 月 22 日 · 17:30',note:'月度分析示例。'}]},
 {id:'guide',title:'to-pages 配置与使用',description:'首次配置、发布页面和查阅历史版本的操作说明。',category:'使用文档',project:'Lemon Pages',updated:'2026-11-20T16:00',revisions:[{name:'v2',date:'11 月 20 日 · 16:00',note:'补充导航配置说明。'},{name:'v1',date:'11 月 16 日 · 12:00',note:'首次配置说明。'}]},
 {id:'automation',title:'自动化任务设计',description:'从创建到运行记录，让重复工作有清晰的入口。',category:'技术方案',project:'Rook',updated:'2026-11-17T15:10',revisions:[{name:'v1',date:'11 月 17 日 · 15:10',note:'任务创建与记录方案。'}]},
 {id:'review',title:'交互体验回顾',description:'整理工作台首轮体验中的反馈与改进方向。',category:'分析报告',project:'Rook',updated:'2026-10-28T14:30',revisions:[{name:'v1',date:'10 月 28 日 · 14:30',note:'阶段回顾。'}]},
 {id:'naming',title:'页面命名与归档约定',description:'统一主题、内容分类与版本的命名方式。',category:'使用文档',project:'Lemon Pages',updated:'2026-10-19T09:00',revisions:[{name:'v1',date:'10 月 19 日 · 09:00',note:'命名约定初版。'}]}
];

const demoNames=['界面布局评审','交互流程说明','数据展示方案','发布记录整理','使用体验回顾','配置操作指南','任务流程梳理','内容归档约定'];
const topics=[...seedTopics];
for(let i=0;i<119;i++){
  const date=new Date(Date.UTC(2026,10,25-(i<26?0:i-25)));
  const day=date.toISOString().slice(0,10);
  const base=seedTopics[i%seedTopics.length];
  topics.push({id:'demo-'+i,title:demoNames[i%demoNames.length]+' · '+String(i+1).padStart(3,'0'),description:base.description,category:categories[i%4],project:i%2?'Lemon Pages':'Rook',updated:day+'T'+String(15-Math.floor(i%26/3)).padStart(2,'0')+':'+String((i*7)%60).padStart(2,'0'),revisions:[{name:'v1',date:day.replaceAll('-',' / '),note:'用于观察分页和月份归档的演示主题。'}]});
}
const PAGE_SIZE=20;
const months=[...new Set(topics.map(t=>t.updated.slice(0,7)))].sort().reverse();
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function readState(){
  const q=new URLSearchParams(location.search);
  return {category:categories.includes(q.get('category'))?q.get('category'):'全部',month:months.includes(q.get('month'))?q.get('month'):'all',query:q.get('q')||'',page:Math.max(1,Number.parseInt(q.get('page'),10)||1)};
}
let state=readState();
function selectedTopics(){return topics.filter(t=>(state.category==='全部'||t.category===state.category)&&(state.month==='all'||t.updated.startsWith(state.month))&&[t.title,t.description,t.category,t.project].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>b.updated.localeCompare(a.updated)||a.id.localeCompare(b.id))}
function stateURL(){const url=new URL(location.href);url.search='';if(state.category!=='全部')url.searchParams.set('category',state.category);if(state.month!=='all')url.searchParams.set('month',state.month);if(state.query)url.searchParams.set('q',state.query);if(state.page>1)url.searchParams.set('page',state.page);return url}
function pageButton(page,label,disabled=false,current=false){return '<button data-page="'+page+'" '+(disabled?'disabled ':'')+(current?'aria-current="page" ':'')+'aria-label="'+esc(label==='‹'?'上一页':label==='›'?'下一页':'第 '+label+' 页')+'">'+esc(label)+'</button>'}
function pager(total,pages,compact=false){
  if(!total)return '';
  if(compact)return '<div class="compact-pager"><span>第 '+state.page+' / '+pages+' 页</span>'+pageButton(state.page-1,'‹',state.page===1)+pageButton(state.page+1,'›',state.page===pages)+'</div>';
  const numbers=pages<=7?Array.from({length:pages},(_,i)=>i+1):[1,...[state.page-1,state.page,state.page+1].filter(p=>p>1&&p<pages),pages];
  let previous=0;
  const buttons=numbers.map(p=>{const gap=p-previous>1?'<span class="page-gap">…</span>':'';previous=p;return gap+pageButton(p,String(p),false,state.page===p)}).join('');
  return '<nav class="pagination" aria-label="主题分页"><span class="page-total">共 '+total+' 个主题 · '+pages+' 页</span><div class="page-buttons">'+pageButton(state.page-1,'‹',state.page===1)+buttons+pageButton(state.page+1,'›',state.page===pages)+'</div><span class="page-size">每页 '+PAGE_SIZE+' 个主题</span></nav>';
}
function categoryTag(t){return '<span class="category-tag '+t.category+'">'+t.category+'</span>'}
function revisionURL(t,index=0){
  if(t.revisions[index].url)return t.revisions[index].url;
  const url=stateURL();url.searchParams.set('preview',t.id);url.searchParams.set('revision',index);return url.href;
}
function showHistory(id){
  const t=topics.find(t=>t.id===id);
  if(t.revisions.length===1){location.href=revisionURL(t);return}
  document.querySelector('#drawer').innerHTML='<p class="drawer-kicker">选择版本</p><h2 id="drawer-title" class="drawer-title">'+esc(t.title)+'</h2><p class="drawer-description">'+esc(t.description)+'</p><div class="drawer-meta">'+esc(t.category)+' / '+esc(t.project)+'</div><h3 class="history-heading">'+t.revisions.length+' 个版本，按发布时间倒序</h3>'+t.revisions.map((r,i)=>'<div class="revision"><div class="revision-head">'+esc(r.name)+(i===0?'<span class="latest">最新版</span>':'')+'</div><span class="revision-date">'+esc(r.date)+'</span><p>'+esc(r.note)+'</p><a href="'+esc(revisionURL(t,i))+'">打开'+(i===0?'最新版':'此版本')+icon('arrow')+'</a></div>').join('')+'<p class="drawer-disclaimer">分类、时间及变更说明为演示数据。Rook 版本链接打开现有报告，其余链接打开示例文档。</p>';
  document.querySelector('#history-dialog').showModal();
}
function renderPreview(t,index){
  const r=t.revisions[index];
  document.title=t.title+' · '+r.name+' · 演示文档';
  document.querySelector('#app').innerHTML='<main class="preview-page"><a class="archive-return" href="'+esc(stateURL().href)+'">← 返回页面档案</a><p class="eyebrow">示例文档 / '+esc(r.name)+'</p><h1>'+esc(t.title)+'</h1><p class="preview-meta">'+esc(t.category)+' · '+esc(t.project)+' · '+esc(r.date)+'</p><p class="preview-description">'+esc(t.description)+'</p><section class="preview-notice"><h2>已直接打开 '+esc(r.name)+'</h2><p>这是一份交互演示文档，用于体验打开页面和返回档案的流程，不包含真实报告正文。</p><p>'+esc(r.note)+'</p></section></main>';
}
function archiveRow(t){
  const multiple=t.revisions.length>1;
  const title=multiple?'<button class="doc-title" data-history="'+t.id+'">'+esc(t.title)+'</button>':'<a class="doc-title" href="'+esc(revisionURL(t))+'">'+esc(t.title)+'</a>';
  const version=multiple?'<button class="history" data-history="'+t.id+'" aria-label="查看'+esc(t.title)+'的版本历史">'+icon('history')+t.revisions.length+' 个版本</button>':'<span class="single-version">'+esc(t.revisions[0].name)+'</span>';
  return '<article class="archive-row" data-topic="'+t.id+'"><div class="archive-date"><strong>'+t.updated.slice(8,10)+'</strong><span>'+t.updated.slice(11)+'</span></div><div>'+title+'<p class="doc-description">'+esc(t.description)+'</p><div class="project">'+esc(t.project)+'</div></div>'+categoryTag(t)+version+'</article>';
}
function render(){
  const query=new URLSearchParams(location.search);
  const preview=topics.find(t=>t.id===query.get('preview'));
  if(preview){const index=Math.min(preview.revisions.length-1,Math.max(0,Number.parseInt(query.get('revision'),10)||0));renderPreview(preview,index);return}
  document.title='Lemon Pages · 月度索引与分页原型';
  const results=selectedTopics();
  const pages=Math.max(1,Math.ceil(results.length/PAGE_SIZE));
  state.page=Math.min(state.page,pages);
  const start=(state.page-1)*PAGE_SIZE;
  const current=results.slice(start,start+PAGE_SIZE);
  const groups=current.reduce((m,t)=>m.set(t.updated.slice(0,7),[...(m.get(t.updated.slice(0,7))||[]),t]),new Map());
  document.querySelector('#app').innerHTML='<main class="c-container"><div class="c-hero"><div><p class="eyebrow">LEMON PAGES / ARCHIVE</p><h1>页面档案</h1><p class="subtitle">按月归档，按分类查找，每个主题保留完整版本。</p></div><label class="search">'+icon('search')+'<input type="search" id="search" aria-label="搜索页面" placeholder="搜索标题、内容或项目" value="'+esc(state.query)+'"></label></div><div class="c-body"><aside class="archive-sidebar"><div class="months"><div class="year-label">2026</div>'+[['all','全部月份'],...months.map(m=>[m,Number(m.slice(5))+' 月'])].map(([m,label])=>'<button class="month-button '+(state.month===m?'selected':'')+'" data-month="'+m+'"><span>'+label+'</span><span>'+topics.filter(t=>m==='all'||t.updated.startsWith(m)).length+'</span></button>').join('')+'</div><p class="month-note">以主题最新更新时间归档<br>同一主题的多轮更新合并</p></aside><section class="archive-content" tabindex="-1"><div class="c-controls"><div class="pills">'+['全部',...categories].map(c=>'<button data-category="'+c+'" class="'+(state.category===c?'selected':'')+'">'+c+'</button>').join('')+'</div><span class="sort-label">'+icon('sort')+'最近更新优先</span></div><div class="result-toolbar"><p id="result-count" role="status">'+(results.length?'显示 '+(start+1)+'–'+Math.min(start+PAGE_SIZE,results.length)+'，共 '+results.length+' 个主题':'没有匹配的主题')+'</p>'+pager(results.length,pages,true)+'</div><div id="month-groups">'+([...groups].map(([month,rows],index)=>{
    const continued=index===0&&start>0&&results[start-1].updated.startsWith(month);
    const count=results.filter(t=>t.updated.startsWith(month)).length;
    return '<section class="month-group" data-month-group="'+month+'"><div class="month-title"><h2>'+Number(month.slice(5))+' 月'+(continued?' <small>· 续</small>':'')+'</h2><span>'+month.slice(0,4)+' / 本月 '+count+' 个主题'+(rows.length<count?' · 此页 '+rows.length+' 个':'')+'</span></div><div class="archive-head"><span>更新日期</span><span>内容主题</span><span>内容分类</span><span>版本</span></div>'+rows.map(archiveRow).join('')+'</section>';
  }).join('')||'<div class="empty"><p>没有符合条件的页面</p><button id="clear-filters">清除筛选</button></div>')+'</div>'+pager(results.length,pages)+'<p class="bottom-note">分页浏览 · 主题只出现一次，历史版本在主题内展开</p></section></div></main>';
  history.replaceState({...history.state},'',stateURL());
}
function update(patch,{replace=false,scroll=true}={}){
  history.replaceState({y:scrollY},'',location.href);
  Object.assign(state,patch);
  const url=stateURL();
  if(replace)history.replaceState({y:scroll?0:scrollY},'',url);else history.pushState({y:0},'',url);
  render();
  if(scroll){window.scrollTo(0,0);document.querySelector('.archive-content').focus({preventScroll:true})}
}
document.addEventListener('click',e=>{
  const page=e.target.closest('[data-page]');const category=e.target.closest('[data-category]');const month=e.target.closest('[data-month]');const topic=e.target.closest('[data-history]');
  if(page&&!page.disabled)update({page:Number(page.dataset.page)});
  if(category)update({category:category.dataset.category,page:1});
  if(month)update({month:month.dataset.month,page:1});
  if(topic)showHistory(topic.dataset.history);
  if(e.target.closest('#clear-filters'))update({category:'全部',month:'all',query:'',page:1});
});
document.addEventListener('input',e=>{if(e.target.id==='search'){const input=e.target;update({query:input.value,page:1},{replace:true,scroll:false});document.querySelector('#search').replaceWith(input);input.focus()}});
document.querySelector('#close-dialog').onclick=()=>document.querySelector('#history-dialog').close();
history.scrollRestoration='manual';
window.addEventListener('popstate',e=>{state=readState();render();requestAnimationFrame(()=>window.scrollTo(0,e.state?.y||0))});
render();
</script><!-- to-pages:back-link:start -->
