 {id:'naming',title:'页面命名与归档约定',description:'统一主题、内容分类与版本的命名方式。',category:'使用文档',project:'Lemon Pages',updated:'2026-10-19T09:00',revisions:[{name:'v1',date:'10 月 19 日 · 09:00',note:'命名约定初版。'}]}
];
const state={variant:['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A',category:'全部',period:'all',query:'',month:'all'};
const escapeHTML=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function filtered(){return topics.filter(t=>(state.category==='全部'||t.category===state.category)&&(state.period==='all'||t.updated.slice(0,10)>='2026-11-19')&&(state.month==='all'||t.updated.startsWith(state.month))&&[t.title,t.description,t.category,t.project].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>b.updated.localeCompare(a.updated))}
function categoryButtons(cls=''){return '<div class="'+cls+'">'+['全部',...categories].map(c=>'<button data-category="'+c+'" class="'+(state.category===c?'selected':'')+'">'+c+'</button>').join('')+'</div>'}
function search(){return '<label class="search">'+icon('search')+'<input type="search" id="search" aria-label="搜索页面" placeholder="搜索标题、内容或项目" value="'+escapeHTML(state.query)+'"></label>'}
function periodSelect(){return '<select class="time-select" id="period" aria-label="时间范围"><option value="all"'+(state.period==='all'?' selected':'')+'>全部时间</option><option value="week"'+(state.period==='week'?' selected':'')+'>最近 7 天</option></select>'}
function historyButton(t){return '<button class="history" data-history="'+t.id+'" aria-label="查看'+t.title+'的'+t.revisions.length+'个版本">'+icon('history')+t.revisions.length+' 个版本</button>'}
function titleButton(t){return '<button class="doc-title" data-history="'+t.id+'">'+t.title+'</button>'}
function dayName(day){return day==='2026-11-25'?'今天':day==='2026-11-24'?'昨天':day.slice(5,7)+' 月 '+Number(day.slice(8))+' 日'}
function smallDate(t){return dayName(t.updated.slice(0,10))}
function stats(){return '<div class="stats"><strong>'+topics.length+'</strong>个主题 <span>／</span><strong>'+topics.reduce((n,t)=>n+t.revisions.length,0)+'</strong>个版本</div>'}
function heading(eyebrow,title,subtitle){return '<div class="heading"><div><p class="eyebrow">'+eyebrow+'</p><h1>'+title+'</h1><p class="subtitle">'+subtitle+'</p></div>'+stats()+'</div>'}
function empty(){return '<div class="empty">没有符合条件的页面。试试其他分类或时间范围。</div>'}
function row(t){return '<article class="doc-row"><div class="doc-icon '+t.category+'">'+icon('doc')+'</div><div class="doc-content">'+titleButton(t)+'<p class="doc-description">'+t.description+'</p><div class="meta"><span class="category-tag '+t.category+'">'+t.category+'</span><span>'+t.project+'</span><span class="dot">·</span><span class="version">'+t.revisions[0].name+'</span>'+historyButton(t)+'</div></div><div class="row-end"><span>'+t.updated.slice(11)+'</span><button class="open-icon" data-history="'+t.id+'" aria-label="查看'+t.title+'">'+icon('arrow')+'</button></div></article>'}
function VariantA(items){const groups=Map.groupBy?Map.groupBy(items,t=>t.updated.slice(0,10)):items.reduce((m,t)=>m.set(t.updated.slice(0,10),[...(m.get(t.updated.slice(0,10))||[]),t]),new Map());return '<div class="a-layout"><aside class="sidebar"><div class="sidebar-label">内容分类</div>'+['全部',...categories].map(c=>'<button class="nav-category '+(state.category===c?'selected':'')+'" data-category="'+c+'"><span class="name">'+(c==='全部'?icon('grid'):'<i class="cat-dot '+c+'"></i>')+(c==='全部'?'所有页面':c)+'</span><span class="number">'+topics.filter(t=>c==='全部'||t.category===c).length+'</span></button>').join('')+'<div class="sidebar-section"><div class="sidebar-label">时间归档</div>'+[['all','全部时间'],['2026-11','2026 年 11 月'],['2026-10','2026 年 10 月']].map(([value,label])=>'<button class="nav-month '+(state.month===value?'selected':'')+'" data-month="'+value+'">'+label+'<span>'+(value==='all'?9:topics.filter(t=>t.updated.startsWith(value)).length)+'</span></button>').join('')+'</div><p class="sidebar-note">每个主题只展示最新版<br>过往更新收在版本历史中</p></aside><main class="main-a">'+heading('YOUR PAGE LIBRARY','所有页面','按最近更新时间浏览，找到上一次工作的地方。')+categoryButtons('mobile-categories')+'<div class="toolbar">'+search()+periodSelect()+'<span class="sort-label">'+icon('sort')+'最近更新优先</span></div><div class="section-label"><span>更新记录 <b style="font-weight:400;color:#adb39f">'+items.length+' 个主题</b></span><span>同一主题的多个版本已合并</span></div><div class="timeline">'+([...groups].map(([day,rows])=>'<section class="day-group"><div class="day-label"><strong>'+dayName(day)+'</strong><span>'+day.slice(5).replace('-',' / ')+'</span></div><div class="day-items">'+rows.map(row).join('')+'</div></section>').join('')||empty())+'</div><p class="bottom-note">已显示全部 '+items.length+' 个主题 · 每个主题默认打开最新版本</p></main></div>'}
function boardCard(t){return '<article class="board-card"><div class="card-top"><span class="card-date">'+icon('clock')+smallDate(t)+'</span>'+(t.updated.startsWith('2026-11-25')?'<span class="card-new">最近更新</span>':'<span class="version">'+t.revisions[0].name+'</span>')+'</div>'+titleButton(t)+'<p class="doc-description">'+t.description+'</p><div class="card-bottom"><span class="project">'+t.project+'</span>'+historyButton(t)+'</div></article>'}
function VariantB(items){const cols=state.category==='全部'?categories:[state.category];return '<main class="main-b">'+heading('COLLECTED, NOT SCATTERED','内容一览','按内容找到方向，再沿时间查看每一次更新。')+'<div class="toolbar"><div class="b-period"><button data-period="all" class="'+(state.period==='all'?'selected':'')+'">全部时间</button><button data-period="week" class="'+(state.period==='week'?'selected':'')+'">最近 7 天</button></div>'+search()+'<select class="time-select" id="category-select" aria-label="内容分类">'+['全部',...categories].map(c=>'<option'+(state.category===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="board" style="'+(cols.length===1?'grid-template-columns:minmax(0,420px)':'')+'">'+cols.map(c=>{const rows=items.filter(t=>t.category===c);return '<section><div class="column-title '+c+'"><i class="cat-dot '+c+'"></i>'+c+'<span class="col-count">'+rows.length+' 个主题</span></div>'+ (rows.map(boardCard).join('')||'<div class="column-empty">这个时间段还没有内容</div>')+'</section>'}).join('')+'</div><p class="bottom-note">各分类内按最近更新时间排序 · 多轮更新收在同一张主题卡片中</p></main>'}
function archiveRow(t){return '<article class="archive-row"><div class="archive-date"><strong>'+t.updated.slice(8,10)+'</strong><span>'+t.updated.slice(11)+'</span></div><div>'+titleButton(t)+'<p class="doc-description">'+t.description+'</p><div class="project">'+t.project+'</div></div><span class="category-tag '+t.category+'">'+t.category+'</span>'+historyButton(t)+'</article>'}
function VariantC(items){const groups=items.reduce((m,t)=>m.set(t.updated.slice(0,7),[...(m.get(t.updated.slice(0,7))||[]),t]),new Map());return '<main class="c-container"><div class="c-hero"><div><p class="eyebrow">LEMON PAGES / ARCHIVE</p><h1>页面档案</h1><p class="subtitle">按月收录，把更新留在时间里。</p></div>'+search()+'</div><div class="c-body"><aside><div class="months"><div class="year-label">2026</div>'+[['all','全部月份'],['2026-11','十一月'],['2026-10','十月']].map(([value,label])=>'<button class="month-button '+(state.month===value?'selected':'')+'" data-month="'+value+'">'+label+'<span>'+(value==='all'?9:topics.filter(t=>t.updated.startsWith(value)).length)+'</span></button>').join('')+'</div><p class="month-note">按主题最近更新时间归档<br>历史版本在主题内查看</p></aside><section><div class="c-controls">'+categoryButtons('pills')+'<span class="stats">'+items.length+' 个主题</span></div>'+([...groups].map(([month,rows])=>'<section style="margin-bottom:32px"><div class="month-title"><h2>'+Number(month.slice(5))+' 月</h2><span>'+rows.length+' 个主题更新</span></div><div class="archive-head"><span>日期</span><span>内容主题</span><span>内容分类</span><span>版本历史</span></div>'+rows.map(archiveRow).join('')+'</section>').join('')||empty())+'<p class="bottom-note">主题只出现一次 · 以最新更新时间归档</p></section></div></main>'}
function render(){document.body.dataset.variant=state.variant;const items=filtered();document.querySelector('#app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[state.variant])(items);document.querySelectorAll('button[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===state.variant));document.querySelector('#variant-state').textContent=({A:'时间为主线 · 分类为筛选',B:'分类为主线 · 时间为排序',C:'月份为索引 · 分类为筛选'}[state.variant]);}
function setVariant(v){state.variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render();console.info('Prototype state',JSON.stringify(state))}
function cycle(delta){setVariant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+delta+3)%3])}
function showHistory(id){const t=topics.find(t=>t.id===id);document.querySelector('#drawer').innerHTML='<p class="drawer-kicker">主题详情 / 版本历史</p><h2 id="drawer-title" class="drawer-title">'+t.title+'</h2><p class="drawer-description">'+t.description+'</p><div class="drawer-meta">'+t.category+' <span style="margin:0 8px;color:#c0c8b5">/</span> '+t.project+'</div><h3 class="history-heading">'+t.revisions.length+' 次发布，保留每一步</h3>'+t.revisions.map((r,i)=>'<div class="revision"><div class="revision-head">'+r.name+(i===0?'<span class="latest">最新版本</span>':'')+'</div><span class="revision-date">'+r.date+'</span><p>'+r.note+'</p>'+(r.url?'<a href="'+r.url+'" target="_blank" rel="noopener">'+(i===0?'打开最新版':'打开此版本')+icon('arrow')+'</a>':'<span class="demo-detail">演示内容，未关联线上页面</span>')+'</div>').join('')+'<p class="drawer-disclaimer">此页面为 UI 设计原型。分类、时间与变更说明为演示数据；Rook 工作台的两个版本链接指向现有页面。</p>';document.querySelector('#history-dialog').showModal()}
document.addEventListener('click',e=>{const variant=e.target.closest('button[data-variant]');const cat=e.target.closest('[data-category]');const month=e.target.closest('[data-month]');const period=e.target.closest('[data-period]');const topic=e.target.closest('[data-history]');if(variant)setVariant(variant.dataset.variant);if(cat){state.category=cat.dataset.category;render()}if(month){state.month=month.dataset.month;render()}if(period){state.period=period.dataset.period;render()}if(topic)showHistory(topic.dataset.history)});
document.addEventListener('input',e=>{if(e.target.id==='search'){const input=e.target;state.query=input.value;render();document.querySelector('#search').replaceWith(input);input.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='period'){state.period=e.target.value;render()}if(e.target.id==='category-select'){state.category=e.target.value;render()}});
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#close-dialog').onclick=()=>document.querySelector('#history-dialog').close();
document.addEventListener('keydown',e=>{if(document.querySelector('dialog').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
window.addEventListener('popstate',()=>{state.variant=new URLSearchParams(location.search).get('variant')||'A';render()});
render();
</script>
