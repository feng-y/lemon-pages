<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" role="img">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
.t { fill: #24211c; font-size: 13px; font-weight: 600; }
.s { fill: #6d665b; font-size: 10.5px; }
.lbl { fill: #8f3d21; font-size: 10px; }
.note { fill: #6d665b; font-size: 10.5px; }
.band-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.box { fill: #fffdf7; stroke: #d8cfbf; stroke-width: 1; }
.box-accent { fill: #f7ece4; stroke: #c98b6f; stroke-width: 1; }
.box-ghost { fill: #f6f1e8; stroke: #c9bfae; stroke-width: 1; stroke-dasharray: 5 4; }
.band { fill: #fbf7ef; stroke: #e7dfd2; stroke-width: 1; }
.arrow { stroke: #9a6a52; stroke-width: 1.4; fill: none; }
.arrow-strong { stroke: #b04e2d; stroke-width: 1.6; fill: none; }
.arrow-muted { stroke: #b8ae9f; stroke-width: 1.2; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.lifeline { stroke: #cfc6b7; stroke-width: 1; stroke-dasharray: 3 4; }
.lbl-bg { fill: #fffdf7; }
.arrow-head { fill: #9a6a52; }
.arrow-head-strong { fill: #b04e2d; }
.c-entry { fill: #3f6b7d; }
.c-time { fill: #8a6a2f; }
.c-state { fill: #5f7038; }
.c-exec { fill: #4a5a6a; }
.c-sec { fill: #a34e35; }
.c-exit { fill: #6b5a7a; }
.bar-entry { fill: #3f6b7d; }
.bar-time { fill: #8a6a2f; }
.bar-state { fill: #5f7038; }
.bar-exec { fill: #4a5a6a; }
.bar-sec { fill: #a34e35; }
.bar-exit { fill: #6b5a7a; }
@media (prefers-color-scheme: dark) {
  .t { fill: #ece7dd; }
  .s, .note { fill: #a9a195; }
  .lbl { fill: #f0a986; }
  .box { fill: #1f1d19; stroke: #37322a; }
  .box-accent { fill: #2e231d; stroke: #6d4a3a; }
  .box-ghost { fill: #23211c; stroke: #4a4238; }
  .band { fill: #1b1a16; stroke: #2c2822; }
  .arrow { stroke: #c98b6f; }
  .arrow-strong { stroke: #e4936c; }
  .arrow-muted { stroke: #6b6458; }
  .lifeline { stroke: #3a352d; }
  .lbl-bg { fill: #1f1d19; }
  .arrow-head { fill: #c98b6f; }
  .arrow-head-strong { fill: #e4936c; }
  .c-entry { fill: #7fb3c7; }
  .c-time { fill: #d6b46a; }
  .c-state { fill: #a9bd7f; }
  .c-exec { fill: #9fb3c4; }
  .c-sec { fill: #e4936c; }
  .c-exit { fill: #b9a3cc; }
}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
</marker>
<marker id="head-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-strong"/>
</marker>
</defs>
<g id="fig2">
<rect x="18" y="40" width="124" height="54" rx="10" class="box"/>
<text x="34" y="64" class="t" font-size="12">事件源 / 时间线</text>
<text x="34" y="82" class="s">评论 / 会话 / 自动化</text>
<line x1="80" y1="94" x2="80" y2="720" class="lifeline"/>
<rect x="158" y="40" width="124" height="54" rx="10" class="box"/>
<text x="174" y="64" class="t" font-size="12">Trigger / Gate</text>
<text x="174" y="82" class="s">触发人 / 角色</text>
<line x1="220" y1="94" x2="220" y2="720" class="lifeline"/>
<rect x="298" y="40" width="124" height="54" rx="10" class="box"/>
<text x="314" y="64" class="t" font-size="12">Inbox / Worker</text>
<text x="314" y="82" class="s">持久事件 · 领取</text>
<line x1="360" y1="94" x2="360" y2="720" class="lifeline"/>
<rect x="438" y="40" width="124" height="54" rx="10" class="box"/>
<text x="454" y="64" class="t" font-size="12">Rook</text>
<text x="454" y="82" class="s">Session + Planner</text>
<line x1="500" y1="94" x2="500" y2="720" class="lifeline"/>
<rect x="578" y="40" width="124" height="54" rx="10" class="box"/>
<text x="594" y="64" class="t" font-size="12">下游 Agent</text>
<text x="594" y="82" class="s">Pi / CC / Codex</text>
<line x1="640" y1="94" x2="640" y2="720" class="lifeline"/>
<rect x="718" y="40" width="124" height="54" rx="10" class="box"/>
<text x="734" y="64" class="t" font-size="12">权限 / 工具</text>
<text x="734" y="82" class="s">凭证 · 仓库 · MR</text>
<line x1="780" y1="94" x2="780" y2="720" class="lifeline"/>
<rect x="858" y="40" width="124" height="54" rx="10" class="box"/>
<text x="874" y="64" class="t" font-size="12">人审 / 任务页</text>
<text x="874" y="82" class="s">计划确认 · 评审</text>
<line x1="920" y1="94" x2="920" y2="720" class="lifeline"/>
<line x1="80" y1="150" x2="220" y2="150" class="arrow" marker-end="url(#head)"/>
<rect x="98.6" y="130.0" width="102.8" height="17.0" rx="3" class="lbl-bg"/>
<text x="150" y="141" class="lbl" text-anchor="middle" font-size="10">Kanban 评论 @Rook</text>
<rect x="130" y="168" width="170" height="38" rx="8" class="box-accent"/>
<text x="215" y="184" class="s" text-anchor="middle" font-size="10.5">触发人 / 角色准入</text>
<text x="215" y="198" class="s" text-anchor="middle" font-size="9.5">Eval（后续阶段）判断意图</text>
<line x1="220" y1="235" x2="360" y2="235" class="arrow" marker-end="url(#head)"/>
<rect x="228.8" y="215.0" width="122.4" height="17.0" rx="3" class="lbl-bg"/>
<text x="290" y="226" class="lbl" text-anchor="middle" font-size="10">写事件（来源 ID 去重）</text>
<line x1="360" y1="280" x2="500" y2="280" class="arrow" marker-end="url(#head)"/>
<rect x="360.2" y="260.0" width="139.6" height="17.0" rx="3" class="lbl-bg"/>
<text x="430" y="271" class="lbl" text-anchor="middle" font-size="10">启动 / 恢复 Rook Session</text>
<line x1="500" y1="325" x2="920" y2="325" class="arrow" marker-end="url(#head)"/>
<rect x="660.0" y="305.0" width="100.0" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="316" class="lbl" text-anchor="middle" font-size="10">提交计划，等待确认</text>
<line x1="920" y1="360" x2="500" y2="360" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="666.6" y="340.0" width="86.8" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="351" class="lbl" text-anchor="middle" font-size="10">确认 / 调整范围</text>
<line x1="500" y1="405" x2="640" y2="405" class="arrow" marker-end="url(#head-strong)"/>
<rect x="535.0" y="385.0" width="70.0" height="17.0" rx="3" class="lbl-bg"/>
<text x="570" y="396" class="lbl" text-anchor="middle" font-size="10">分派开发任务</text>
<line x1="640" y1="450" x2="780" y2="450" class="arrow" marker-end="url(#head)"/>
<rect x="668.2" y="430.0" width="83.6" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="441" class="lbl" text-anchor="middle" font-size="10">读仓库 / 推 MR</text>
<line x1="780" y1="490" x2="640" y2="490" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="666.6" y="470.0" width="86.8" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="481" class="lbl" text-anchor="middle" font-size="10">凭证注入 / 允许</text>
<line x1="640" y1="535" x2="500" y2="535" class="arrow" marker-end="url(#head)"/>
<rect x="528.2" y="515.0" width="83.6" height="17.0" rx="3" class="lbl-bg"/>
<text x="570" y="526" class="lbl" text-anchor="middle" font-size="10">MR 链接 + 证据</text>
<line x1="500" y1="580" x2="920" y2="580" class="arrow" marker-end="url(#head)"/>
<rect x="660.0" y="560.0" width="100.0" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="571" class="lbl" text-anchor="middle" font-size="10">提交评审（审核中）</text>
<line x1="920" y1="625" x2="500" y2="625" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="676.6" y="605.0" width="66.8" height="17.0" rx="3" class="lbl-bg"/>
<text x="710" y="616" class="lbl" text-anchor="middle" font-size="10">退回 / 通过</text>
<line x1="500" y1="670" x2="80" y2="670" class="arrow" marker-end="url(#head)"/>
<rect x="241.6" y="650.0" width="96.8" height="17.0" rx="3" class="lbl-bg"/>
<text x="290" y="661" class="lbl" text-anchor="middle" font-size="10">写回时间线 / 状态</text>
<line x1="80" y1="710" x2="360" y2="710" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="161.0" y="690.0" width="118.0" height="17.0" rx="3" class="lbl-bg"/>
<text x="220" y="701" class="lbl" text-anchor="middle" font-size="10">评论 / 退回 → 新事件</text>
<rect x="80" y="748" width="840" height="44" rx="10" class="box-ghost"/>
<text x="500" y="766" class="note" text-anchor="middle" font-size="10.5">自动化：Rook Session 可设为 automation；每次触发都是新会话；Scheduler 到期把事件送回 Inbox。</text>
<text x="500" y="781" class="note" text-anchor="middle" font-size="10">虚线 = 延迟结果 / 跨运行；实线 = 当前运行。</text>
</g>
</svg>
