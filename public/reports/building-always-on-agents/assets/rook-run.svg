<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" role="img">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
.t { fill: #24211c; font-size: 14px; font-weight: 600; }
.s { fill: #6d665b; font-size: 11.5px; }
.lbl { fill: #8f3d21; font-size: 11.5px; }
.note { fill: #6d665b; font-size: 11.5px; }
.band-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.box { fill: #fffdf7; stroke: #d8cfbf; stroke-width: 1; }
.box-accent { fill: #f7ece4; stroke: #c98b6f; stroke-width: 1; }
.box-ghost { fill: #f6f1e8; stroke: #c9bfae; stroke-width: 1; stroke-dasharray: 5 4; }
.band { fill: #fbf7ef; stroke: #e7dfd2; stroke-width: 1; }
.arrow { stroke: #9a6a52; stroke-width: 1.4; fill: none; }
.arrow-strong { stroke: #b04e2d; stroke-width: 1.6; fill: none; }
.arrow-muted { stroke: #b8ae9f; stroke-width: 1.2; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.lifeline { stroke: #cfc6b7; stroke-width: 1; stroke-dasharray: 3 4; }
.lbl-bg { fill: #fffdf7; }
.arrow-head { fill: #9a6a52; }
.arrow-head-strong { fill: #b04e2d; }
.c-entry { fill: #3f6b7d; }
.c-time { fill: #8a6a2f; }
.c-state { fill: #5f7038; }
.c-exec { fill: #4a5a6a; }
.c-sec { fill: #a34e35; }
.c-exit { fill: #6b5a7a; }
.bar-entry { fill: #3f6b7d; }
.bar-time { fill: #8a6a2f; }
.bar-state { fill: #5f7038; }
.bar-exec { fill: #4a5a6a; }
.bar-sec { fill: #a34e35; }
.bar-exit { fill: #6b5a7a; }
@media (prefers-color-scheme: dark) {
  .t { fill: #ece7dd; }
  .s, .note { fill: #a9a195; }
  .lbl { fill: #f0a986; }
  .box { fill: #1f1d19; stroke: #37322a; }
  .box-accent { fill: #2e231d; stroke: #6d4a3a; }
  .box-ghost { fill: #23211c; stroke: #4a4238; }
  .band { fill: #1b1a16; stroke: #2c2822; }
  .arrow { stroke: #c98b6f; }
  .arrow-strong { stroke: #e4936c; }
  .arrow-muted { stroke: #6b6458; }
  .lifeline { stroke: #3a352d; }
  .lbl-bg { fill: #1f1d19; }
  .arrow-head { fill: #c98b6f; }
  .arrow-head-strong { fill: #e4936c; }
  .c-entry { fill: #7fb3c7; }
  .c-time { fill: #d6b46a; }
  .c-state { fill: #a9bd7f; }
  .c-exec { fill: #9fb3c4; }
  .c-sec { fill: #e4936c; }
  .c-exit { fill: #b9a3cc; }
}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
</marker>
<marker id="head-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-strong"/>
</marker>
</defs>
<g id="fig2">
<rect x="14" y="40" width="132" height="54" rx="10" class="box"/>
<text x="30" y="64" class="t" font-size="13">事件源 / 时间线</text>
<text x="30" y="82" class="s">评论 / 会话 / 自动化</text>
<line x1="80" y1="94" x2="80" y2="720" class="lifeline"/>
<rect x="154" y="40" width="132" height="54" rx="10" class="box"/>
<text x="170" y="64" class="t" font-size="13">Trigger / Gate</text>
<text x="170" y="82" class="s">触发人 / 角色</text>
<line x1="220" y1="94" x2="220" y2="720" class="lifeline"/>
<rect x="294" y="40" width="132" height="54" rx="10" class="box"/>
<text x="310" y="64" class="t" font-size="13">Inbox / Worker</text>
<text x="310" y="82" class="s">Queue · 领取</text>
<line x1="360" y1="94" x2="360" y2="720" class="lifeline"/>
<rect x="434" y="40" width="132" height="54" rx="10" class="box"/>
<text x="450" y="64" class="t" font-size="13">Rook</text>
<text x="450" y="82" class="s">Session + 计划</text>
<line x1="500" y1="94" x2="500" y2="720" class="lifeline"/>
<rect x="574" y="40" width="132" height="54" rx="10" class="box"/>
<text x="590" y="64" class="t" font-size="13">下游 Agent</text>
<text x="590" y="82" class="s">Pi / CC / Codex</text>
<line x1="640" y1="94" x2="640" y2="720" class="lifeline"/>
<rect x="714" y="40" width="132" height="54" rx="10" class="box"/>
<text x="730" y="64" class="t" font-size="13">权限 / 工具</text>
<text x="730" y="82" class="s">SSO · 凭证 · 仓库</text>
<line x1="780" y1="94" x2="780" y2="720" class="lifeline"/>
<rect x="854" y="40" width="132" height="54" rx="10" class="box"/>
<text x="870" y="64" class="t" font-size="13">人审 / 任务页</text>
<text x="870" y="82" class="s">确认 · 评审</text>
<line x1="920" y1="94" x2="920" y2="720" class="lifeline"/>
<line x1="80" y1="150" x2="220" y2="150" class="arrow" marker-end="url(#head)"/>
<rect x="91.6" y="128.5" width="116.7" height="18.5" rx="3" class="lbl-bg"/>
<text x="150" y="141.0" class="lbl" text-anchor="middle" font-size="11.5">Kanban 评论 @Rook</text>
<rect x="130" y="168" width="170" height="38" rx="8" class="box-accent"/>
<text x="215" y="184" class="s" text-anchor="middle" font-size="11.5">触发人 / 角色准入</text>
<text x="215" y="198" class="s" text-anchor="middle" font-size="10.5">Eval（后续阶段）判断意图</text>
<line x1="220" y1="235" x2="360" y2="235" class="arrow" marker-end="url(#head)"/>
<rect x="244.8" y="213.5" width="90.5" height="18.5" rx="3" class="lbl-bg"/>
<text x="290" y="226.0" class="lbl" text-anchor="middle" font-size="11.5">写事件（去重）</text>
<line x1="360" y1="280" x2="500" y2="280" class="arrow" marker-end="url(#head)"/>
<rect x="371.6" y="258.5" width="116.7" height="18.5" rx="3" class="lbl-bg"/>
<text x="430" y="271.0" class="lbl" text-anchor="middle" font-size="11.5">恢复 Rook Session</text>
<line x1="500" y1="325" x2="920" y2="325" class="arrow" marker-end="url(#head)"/>
<rect x="653.2" y="303.5" width="113.5" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="316.0" class="lbl" text-anchor="middle" font-size="11.5">会话入口：提交计划</text>
<line x1="920" y1="360" x2="500" y2="360" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="660.8" y="338.5" width="98.3" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="351.0" class="lbl" text-anchor="middle" font-size="11.5">确认 / 调整范围</text>
<line x1="500" y1="405" x2="640" y2="405" class="arrow" marker-end="url(#head-strong)"/>
<rect x="530.5" y="383.5" width="79.0" height="18.5" rx="3" class="lbl-bg"/>
<text x="570" y="396.0" class="lbl" text-anchor="middle" font-size="11.5">分派开发任务</text>
<line x1="640" y1="450" x2="780" y2="450" class="arrow" marker-end="url(#head)"/>
<rect x="662.7" y="428.5" width="94.6" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="441.0" class="lbl" text-anchor="middle" font-size="11.5">读仓库 / 推 MR</text>
<line x1="780" y1="490" x2="640" y2="490" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="660.8" y="468.5" width="98.3" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="481.0" class="lbl" text-anchor="middle" font-size="11.5">凭证注入 / 允许</text>
<line x1="640" y1="535" x2="500" y2="535" class="arrow" marker-end="url(#head)"/>
<rect x="522.7" y="513.5" width="94.6" height="18.5" rx="3" class="lbl-bg"/>
<text x="570" y="526.0" class="lbl" text-anchor="middle" font-size="11.5">MR 链接 + 证据</text>
<line x1="500" y1="580" x2="920" y2="580" class="arrow" marker-end="url(#head)"/>
<rect x="653.2" y="558.5" width="113.5" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="571.0" class="lbl" text-anchor="middle" font-size="11.5">提交评审（审核中）</text>
<line x1="920" y1="625" x2="500" y2="625" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="672.3" y="603.5" width="75.3" height="18.5" rx="3" class="lbl-bg"/>
<text x="710" y="616.0" class="lbl" text-anchor="middle" font-size="11.5">退回 / 通过</text>
<line x1="500" y1="670" x2="80" y2="670" class="arrow" marker-end="url(#head)"/>
<rect x="235.1" y="648.5" width="109.8" height="18.5" rx="3" class="lbl-bg"/>
<text x="290" y="661.0" class="lbl" text-anchor="middle" font-size="11.5">写回时间线 / 状态</text>
<line x1="80" y1="710" x2="360" y2="710" class="arrow-muted dashed" marker-end="url(#head)"/>
<rect x="152.9" y="688.5" width="134.2" height="18.5" rx="3" class="lbl-bg"/>
<text x="220" y="701.0" class="lbl" text-anchor="middle" font-size="11.5">评论 / 退回 → 新事件</text>
<rect x="80" y="748" width="840" height="44" rx="10" class="box-ghost"/>
<text x="500" y="766" class="note" text-anchor="middle" font-size="11.5">Phase 1：评论进入 Session Queue，同一事务出队建 Run；Phase 3：MR 评论/告警/定时进入 Durable Inbox。</text>
<text x="500" y="781" class="note" text-anchor="middle" font-size="11">虚线 = 延迟结果 / 跨运行；实线 = 当前运行。</text>
</g>
</svg>
