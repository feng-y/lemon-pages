.box-ghost { fill: #f6f1e8; stroke: #c9bfae; stroke-width: 1; stroke-dasharray: 5 4; }
.band { fill: #fbf7ef; stroke: #e7dfd2; stroke-width: 1; }
.arrow { stroke: #9a6a52; stroke-width: 1.4; fill: none; }
.arrow-strong { stroke: #b04e2d; stroke-width: 1.6; fill: none; }
.arrow-muted { stroke: #b8ae9f; stroke-width: 1.2; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.lifeline { stroke: #cfc6b7; stroke-width: 1; stroke-dasharray: 3 4; }
.lbl-bg { fill: #fffdf7; }
.arrow-head { fill: #9a6a52; }
.arrow-head-strong { fill: #b04e2d; }
.c-entry { fill: #3f6b7d; }
.c-time { fill: #8a6a2f; }
.c-state { fill: #5f7038; }
.c-exec { fill: #4a5a6a; }
.c-sec { fill: #a34e35; }
.c-exit { fill: #6b5a7a; }
.bar-entry { fill: #3f6b7d; }
.bar-time { fill: #8a6a2f; }
.bar-state { fill: #5f7038; }
.bar-exec { fill: #4a5a6a; }
.bar-sec { fill: #a34e35; }
.bar-exit { fill: #6b5a7a; }
@media (prefers-color-scheme: dark) {
  .t { fill: #ece7dd; }
