<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" role="img">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
.t { fill: #24211c; font-size: 13px; font-weight: 600; }
.s { fill: #6d665b; font-size: 10.5px; }
.lbl { fill: #8f3d21; font-size: 10px; }
.note { fill: #6d665b; font-size: 10.5px; }
